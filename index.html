<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KurdTell - پەیوەندی دەنگی</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-inner: #1a233a;
      --primary: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #263352;
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 14px; direction: rtl; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; width: 100%; max-width: 380px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); }
    h1 { color: var(--primary); font-size: 1.5rem; text-align: center; margin-bottom: 5px; }
    p.sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    input { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--border); background: #060911; color: #fff; margin-bottom: 12px; font-size: 1.1rem; text-align: center; outline: none; }
    .btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-green { background: var(--primary); color: #042f2e; }
    .btn-red { background: var(--danger); color: #fff; }
    
    #clientApp { display: none; }
    .user-header { background: var(--card-inner); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .display-num { background: #060911; border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; font-size: 1.5rem; font-weight: bold; min-height: 55px; margin-bottom: 15px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .key { background: var(--card-inner); border: 1px solid var(--border); color: #fff; padding: 15px 0; border-radius: 12px; font-size: 1.35rem; font-weight: bold; cursor: pointer; }
    .key:active { background: var(--primary); color: #000; }
    
    .call-overlay { display: none; position: fixed; inset: 0; background: rgba(9, 13, 22, 0.98); z-index: 99; flex-direction: column; align-items: center; justify-content: center; }
    .call-target { font-size: 1.6rem; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card" id="authBox">
  <h1>KurdTell ⚡</h1>
  <p class="sub">چوونەژوورەوەی هێڵ</p>
  <input type="tel" id="inputPhone" placeholder="ژمارەی هێڵ">
  <input type="password" id="inputPass" placeholder="وشەی نهێنی">
  <button onclick="login()" class="btn btn-green" id="btnLog">چوونەژوورەوە 📲</button>
  <p id="err" style="color:var(--danger); text-align:center; margin-top:10px; font-size:0.85rem;"></p>
</div>

<div class="card" id="clientApp">
  <div class="user-header">
    <div>
      <h3 id="uName" style="color:var(--primary);">--</h3>
      <small id="uPhone" style="color:var(--muted);">--</small>
    </div>
    <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">دەرچوون 🚪</button>
  </div>
  <div class="display-num" id="dialDisplay"></div>
  <div class="keypad">
    <button class="key" onclick="press('1')">1</button>
    <button class="key" onclick="press('2')">2</button>
    <button class="key" onclick="press('3')">3</button>
    <button class="key" onclick="press('4')">4</button>
    <button class="key" onclick="press('5')">5</button>
    <button class="key" onclick="press('6')">6</button>
    <button class="key" onclick="press('7')">7</button>
    <button class="key" onclick="press('8')">8</button>
    <button class="key" onclick="press('9')">9</button>
    <button class="key" onclick="clearD()" style="color:var(--danger);">C</button>
    <button class="key" onclick="press('0')">0</button>
    <button class="key" onclick="backD()">⌫</button>
  </div>
  <button onclick="startCall()" class="btn btn-green">📞 پەیوەندیکردن</button>
</div>

<div class="call-overlay" id="callModal">
  <div style="font-size: 4rem; margin-bottom: 15px;">📞</div>
  <div class="call-target" id="targetView">------</div>
  <div id="callState" style="color:var(--muted); margin-bottom: 25px;">پەیوەندی دەبەسترێت...</div>
  <button onclick="hangupCall()" class="btn btn-red" style="max-width: 200px;">داخستنەوە 📴</button>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCv-XoBKJ4ZvvSuMMt3UqnJSUSHb6NTdzY",
    databaseURL: "https://voice-system-c7785-default-rtdb.firebaseio.com"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let myPhone = null;
  let peer = null;
  let localStream = null;
  let callRef = null;

  window.onload = function() {
    const s = localStorage.getItem("kt_client");
    if (s) {
      const u = JSON.parse(s);
      myPhone = u.phone;
      openApp(u.name, u.phone);
    }
  };

  async function login() {
    const p = document.getElementById("inputPhone").value.trim();
    const pass = document.getElementById("inputPass").value.trim();
    if (!p || !pass) return;

    document.getElementById("btnLog").innerText = "چاوەڕێبە...";
    
    db.ref("users/" + p).once("value").then(snap => {
      const u = snap.val();
      if (u && (u.password === pass || u.pass === pass)) {
        myPhone = p;
        const name = u.fullName || u.name || "کڕیار";
        localStorage.setItem("kt_client", JSON.stringify({ phone: p, name: name }));
        openApp(name, p);
      } else {
        document.getElementById("err").innerText = "ژمارە یان ڕەمز هەڵەیە!";
      }
    }).finally(() => {
      document.getElementById("btnLog").innerText = "چوونەژوورەوە 📲";
    });
  }

  function openApp(name, phone) {
    document.getElementById("authBox").style.display = "none";
    document.getElementById("clientApp").style.display = "block";
    document.getElementById("uName").innerText = name;
    document.getElementById("uPhone").innerText = "هێڵ: " + phone;
    listenForCalls();
  }

  function logout() {
    localStorage.removeItem("kt_client");
    location.reload();
  }

  function press(n) { document.getElementById("dialDisplay").innerText += n; }
  function clearD() { document.getElementById("dialDisplay").innerText = ""; }
  function backD() {
    const d = document.getElementById("dialDisplay");
    d.innerText = d.innerText.slice(0, -1);
  }

  // گوێگرتن لە پەیوەندی هاتووەکان ڕاستەوخۆ لە فایربەیس
  function listenForCalls() {
    db.ref("calls/" + myPhone).on("value", async snap => {
      const data = snap.val();
      if (!data) return;

      if (data.type === "offer" && !peer) {
        const accept = confirm(`📞 پەیوەندی لە هێڵی [${data.from}] هاتووە!\nوەڵام دەدەیتەوە؟`);
        if (accept) {
          answerCall(data);
        } else {
          db.ref("calls/" + myPhone).remove();
        }
      } else if (data.type === "answer" && peer) {
        await peer.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById("callState").innerText = "قسەکردن چالاکە 🟢";
      } else if (data.type === "hangup") {
        closeCallUI();
      }
    });

    // گوێگرتن لە ICE
    db.ref("ice/" + myPhone).on("child_added", async snap => {
      const cand = snap.val();
      if (peer && cand) {
        try { await peer.addIceCandidate(new RTCIceCandidate(cand)); } catch(e){}
      }
    });
  }

  async function startCall() {
    const target = document.getElementById("dialDisplay").innerText.trim();
    if (!target) return alert("ژمارەی هێڵ بنووسە!");
    if (target === myPhone) return alert("ناتوانیت پەیوەندی بە خۆتەوە بکەیت!");

    showCallUI(target, "زەنگ لێدەدات...");

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      peer = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

      localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

      peer.ontrack = e => {
        document.getElementById("remoteAudio").srcObject = e.streams[0];
      };

      peer.onicecandidate = e => {
        if (e.candidate) db.ref("ice/" + target).push(e.candidate.toJSON());
      };

      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);

      callRef = target;
      db.ref("calls/" + target).set({
        type: "offer",
        from: myPhone,
        offer: { type: offer.type, sdp: offer.sdp }
      });
    } catch (err) {
      alert("ڕێگەپێدانی مایک پێویستە: " + err.message);
      closeCallUI();
    }
  }

  async function answerCall(data) {
    showCallUI(data.from, "دەبەسترێت...");
    callRef = data.from;

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      peer = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

      localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

      peer.ontrack = e => {
        document.getElementById("remoteAudio").srcObject = e.streams[0];
      };

      peer.onicecandidate = e => {
        if (e.candidate) db.ref("ice/" + data.from).push(e.candidate.toJSON());
      };

      await peer.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);

      db.ref("calls/" + data.from).set({
        type: "answer",
        from: myPhone,
        answer: { type: answer.type, sdp: answer.sdp }
      });

      document.getElementById("callState").innerText = "قسەکردن چالاکە 🟢";
    } catch (err) {
      alert("هەڵە لە وەڵامدانەوە: " + err.message);
      closeCallUI();
    }
  }

  function hangupCall() {
    if (callRef) {
      db.ref("calls/" + callRef).set({ type: "hangup" });
    }
    db.ref("calls/" + myPhone).remove();
    db.ref("ice/" + myPhone).remove();
    closeCallUI();
  }

  function showCallUI(target, state) {
    document.getElementById("targetView").innerText = target;
    document.getElementById("callState").innerText = state;
    document.getElementById("callModal").style.display = "flex";
  }

  function closeCallUI() {
    if (peer) { peer.close(); peer = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    document.getElementById("callModal").style.display = "none";
  }
</script>
</body>
</html>
